name: Build Flutter APK

on:
  push:
    branches: [ principale, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
      
      # Genera automaticamente la struttura del progetto se non esiste
      - name: Create Flutter Project Structure
        run: |
          flutter create . --org com.venom.ia --project-name venom_ia --platforms=android
          mkdir -p lib
          echo "Codice temporaneo" > lib/main.dart

      # Sostituisce il main.dart generato con il tuo codice personalizzato di Venom
      - name: Inject Venom Code
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const VenomApp());
          }

          class VenomApp extends StatelessWidget {
            const VenomApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Venom IA',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: Colors.black,
                  colorScheme: const ColorScheme.dark(
                    primary: Colors.redAccent,
                    secondary: Colors.red,
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatelessWidget {
            const HomeScreen({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('VENOM IA'),
                  centerTitle: true,
                  backgroundColor: Colors.black,
                ),
                body: const Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.terminal, size: 80, color: Colors.redAccent),
                      SizedBox(height: 20),
                      Text(
                        'Venom IA è Pronta!',
                        style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
